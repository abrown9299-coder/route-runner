<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Old RouteRunner site -> Stopflow redirect (rebrand spec §7).
  STAGED ONLY — NOT PUSHED. Deployed via the existing GitHub Pages path one
  final time (replacing https://abrown9299-coder.github.io/route-runner/),
  then that deploy path is retired.
-->
<meta http-equiv="refresh" content="0;url=https://stopflow.io">
<title>Stopflow has moved</title>
<style>
  /* Stopflow brand palette, inline (spec §2): navy #0B1B33, teal #0E7C7B,
     aqua #2DD4BF, ink #E8F1F2, muted #8AA0B4. */
  :root{
    --sf-navy:#0B1B33; --sf-teal:#0E7C7B; --sf-aqua:#2DD4BF;
    --sf-ink:#E8F1F2; --sf-muted:#8AA0B4;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--sf-navy); color:var(--sf-ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card{text-align:center; padding:2.5rem 2rem; max-width:26rem}
  .mark{
    width:64px; height:64px; margin:0 auto 1rem; border-radius:18px;
    background:linear-gradient(135deg,var(--sf-teal),var(--sf-aqua));
    display:flex; align-items:center; justify-content:center;
    font-size:2rem; font-weight:800; color:var(--sf-navy);
  }
  h1{font-size:1.5rem; margin:0 0 .5rem}
  p{color:var(--sf-muted); margin:0 0 1.5rem; line-height:1.5}
  a.btn{
    display:inline-block; padding:.9rem 2rem; border-radius:999px;
    background:var(--sf-teal); color:#fff; text-decoration:none;
    font-weight:700; font-size:1.05rem;
  }
  a.btn:active{background:var(--sf-aqua)}
  .url{margin-top:1rem; font-size:.85rem; color:var(--sf-muted); word-break:break-all}
  .url a, noscript a{color:var(--sf-aqua)}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">S</div>
  <h1>Stopflow has moved</h1>
  <p>RouteRunner is now <strong>Stopflow</strong>. You&rsquo;re being redirected to the new home:</p>
  <a class="btn" href="https://stopflow.io">Open Stopflow</a>
  <p class="url">https://stopflow.io</p>
  <noscript>
    <p>JavaScript is off &mdash; tap the button above or open
      <a href="https://stopflow.io">https://stopflow.io</a> to continue.</p>
  </noscript>
</main>
<script>
  // Kill the old RouteRunner service worker so installed phones don't keep
  // serving the cached app shell instead of this redirect.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    });
  }
  // Primary redirect for JS-capable clients; the meta refresh above covers
  // everyone else. replace() keeps the old URL out of the back-button history.
  window.location.replace('https://stopflow.io');
</script>
</body>
</html>
